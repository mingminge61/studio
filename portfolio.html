<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포트폴리오 이미지 등록 (관리자용)</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root {
    --c-ink: #1B1F1B;
    --c-paper: #F5F6F3;
    --c-forest: #2F6F4E;
    --c-line: #DDE2DC;
    --c-error: #B3493A;
    --c-film: #5B645B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--c-paper);
    color: var(--c-ink);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }
  .warn-banner {
    background: #FFF4D6;
    border: 1px solid #E8C76B;
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 28px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 6px;
  }
  .sub {
    font-size: 13px;
    color: var(--c-film);
    margin: 0 0 28px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--c-line);
    border-radius: 10px;
    padding: 22px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 14px;
    margin: 0 0 16px;
    color: var(--c-film);
    font-weight: 600;
  }
  .field {
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 12.5px;
    color: var(--c-film);
    margin-bottom: 6px;
  }
  .field input[type="text"],
  .field input[type="password"],
  .field input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    border: 1px solid var(--c-line);
    border-radius: 6px;
    outline: none;
  }
  .field input:focus { border-color: var(--c-forest); }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .file-drop {
    border: 1px dashed var(--c-line);
    border-radius: 8px;
    padding: 22px;
    text-align: center;
    font-size: 13px;
    color: var(--c-film);
    cursor: pointer;
    position: relative;
  }
  .file-drop input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }
  .file-drop.has-file { border-color: var(--c-forest); }
  .preview-thumb {
    max-width: 160px;
    max-height: 160px;
    border-radius: 6px;
    margin: 12px auto 0;
    display: none;
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
  }

  .btn {
    width: 100%;
    padding: 13px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    color: #fff;
    background: var(--c-forest);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn:hover { opacity: 0.92; }
  .btn:disabled { background: #C7CCC2; cursor: not-allowed; }

  .status-msg {
    margin-top: 12px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }
  .status-msg.is-error { color: var(--c-error); }
  .status-msg.is-success { color: var(--c-forest); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 6px; border-bottom: 1px solid var(--c-line); text-align: left; }
  th { color: var(--c-film); font-weight: 600; }
  td.thumb-cell img { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; }
  .empty-row { text-align: center; color: var(--c-film); padding: 24px 0; }
  .tag-y { color: var(--c-forest); font-weight: 600; }
  .tag-n { color: var(--c-error); }
</style>
</head>
<body>

<div class="wrap">

  <div class="warn-banner">
    이 페이지는 GitHub에 쓰기 권한이 있는 토큰을 사용합니다. <strong>공개 사이트(Netlify 배포 저장소)에는 올리지 말고, 본인 컴퓨터에서만 여는 개인용 파일로 보관해주세요.</strong>
  </div>

  <h1>포트폴리오 이미지 등록</h1>
  <p class="sub">사진을 선택하면 GitHub 저장소에 업로드하고, 동시에 구글시트(포트폴리오 탭)에 한 줄을 추가합니다.</p>

  <!-- 연결 설정 -->
  <div class="card">
    <h2>연결 설정 (한 번만 입력하면 브라우저에 저장됩니다)</h2>
    <div class="field">
      <label for="ghToken">GitHub Personal Access Token</label>
      <input type="password" id="ghToken" placeholder="ghp_... 또는 github_pat_...">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="ghRepo">저장소 (owner/repo)</label>
        <input type="text" id="ghRepo" placeholder="예: mingming/photo-studio">
      </div>
      <div class="field">
        <label for="ghBranch">브랜치</label>
        <input type="text" id="ghBranch" placeholder="main" value="main">
      </div>
    </div>
    <div class="field">
      <label for="appsScriptUrl">Apps Script 웹 앱 URL</label>
      <input type="text" id="appsScriptUrl" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
  </div>

  <!-- 등록 폼 -->
  <div class="card">
    <h2>새 작업물 등록</h2>

    <div class="field">
      <label>사진 파일</label>
      <div class="file-drop" id="fileDrop">
        <span id="fileDropLabel">클릭해서 사진을 선택하세요</span>
        <input type="file" id="fileInput" accept="image/*">
        <img id="previewThumb" class="preview-thumb">
      </div>
    </div>

    <div class="field">
      <label for="fileName">저장될 파일명 (영문/숫자, 한글·공백 금지)</label>
      <input type="text" id="fileName" placeholder="예: 04.jpg">
    </div>

    <div class="field-row">
      <div class="field">
        <label for="orderInput">노출 순서</label>
        <input type="number" id="orderInput" placeholder="예: 4">
      </div>
      <div class="field">
        <label for="exifInput">EXIF 문구 (선택)</label>
        <input type="text" id="exifInput" placeholder="예: F/2.0 · 1/250s">
      </div>
    </div>

    <div class="field checkbox-row">
      <input type="checkbox" id="visibleInput" checked>
      <label for="visibleInput" style="margin:0;">등록 즉시 메인페이지에 공개</label>
    </div>

    <button class="btn" id="submitBtn">등록하기</button>
    <p class="status-msg" id="statusMsg"></p>
  </div>

  <!-- 현재 목록 -->
  <div class="card">
    <h2>현재 등록된 포트폴리오 목록</h2>
    <table>
      <thead>
        <tr><th>미리보기</th><th>순서</th><th>경로</th><th>EXIF</th><th>공개</th></tr>
      </thead>
      <tbody id="listBody">
        <tr><td colspan="5" class="empty-row">불러오는 중입니다...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
(function () {
  const els = {
    ghToken: document.getElementById('ghToken'),
    ghRepo: document.getElementById('ghRepo'),
    ghBranch: document.getElementById('ghBranch'),
    appsScriptUrl: document.getElementById('appsScriptUrl'),
    fileDrop: document.getElementById('fileDrop'),
    fileDropLabel: document.getElementById('fileDropLabel'),
    fileInput: document.getElementById('fileInput'),
    previewThumb: document.getElementById('previewThumb'),
    fileName: document.getElementById('fileName'),
    orderInput: document.getElementById('orderInput'),
    exifInput: document.getElementById('exifInput'),
    visibleInput: document.getElementById('visibleInput'),
    submitBtn: document.getElementById('submitBtn'),
    statusMsg: document.getElementById('statusMsg'),
    listBody: document.getElementById('listBody')
  };

  const CONFIG_KEY = 'portfolioAdminConfig';

  // ====== 설정값 저장/복원 (이 컴퓨터의 브라우저에만 저장됨) ======
  function loadConfig() {
    try {
      const saved = JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}');
      if (saved.ghToken) els.ghToken.value = saved.ghToken;
      if (saved.ghRepo) els.ghRepo.value = saved.ghRepo;
      if (saved.ghBranch) els.ghBranch.value = saved.ghBranch;
      if (saved.appsScriptUrl) els.appsScriptUrl.value = saved.appsScriptUrl;
    } catch (err) { /* 저장된 값 없음 */ }
  }

  function saveConfig() {
    localStorage.setItem(CONFIG_KEY, JSON.stringify({
      ghToken: els.ghToken.value.trim(),
      ghRepo: els.ghRepo.value.trim(),
      ghBranch: els.ghBranch.value.trim() || 'main',
      appsScriptUrl: els.appsScriptUrl.value.trim()
    }));
  }

  [els.ghToken, els.ghRepo, els.ghBranch, els.appsScriptUrl].forEach(function (el) {
    el.addEventListener('change', saveConfig);
  });

  loadConfig();

  // ====== 파일 선택 미리보기 ======
  let selectedFile = null;

  els.fileInput.addEventListener('change', function () {
    const file = els.fileInput.files[0];
    if (!file) return;
    selectedFile = file;

    els.fileDrop.classList.add('has-file');
    els.fileDropLabel.textContent = file.name;

    const reader = new FileReader();
    reader.onload = function (e) {
      els.previewThumb.src = e.target.result;
      els.previewThumb.style.display = 'block';
    };
    reader.readAsDataURL(file);

    if (!els.fileName.value) {
      els.fileName.value = file.name.replace(/\s+/g, '-');
    }
  });

  // ====== 목록 불러오기 ======
  function loadList() {
    const url = els.appsScriptUrl.value.trim();
    if (!url) {
      els.listBody.innerHTML = '<tr><td colspan="5" class="empty-row">Apps Script URL을 먼저 입력해주세요.</td></tr>';
      return;
    }

    fetch(url + '?type=portfolio')
      .then(function (res) { return res.json(); })
      .then(function (data) { renderList(data.items || []); })
      .catch(function (err) {
        console.error('[포트폴리오 관리] 목록 조회 실패:', err);
        els.listBody.innerHTML = '<tr><td colspan="5" class="empty-row">목록을 불러오지 못했습니다.</td></tr>';
      });
  }

  function renderList(items) {
    if (!items.length) {
      els.listBody.innerHTML = '<tr><td colspan="5" class="empty-row">등록된 항목이 없습니다.</td></tr>';
      return;
    }

    const repo = els.ghRepo.value.trim();
    const branch = els.ghBranch.value.trim() || 'main';

    els.listBody.innerHTML = '';
    items.forEach(function (item) {
      const tr = document.createElement('tr');

      const thumbTd = document.createElement('td');
      thumbTd.className = 'thumb-cell';
      const img = document.createElement('img');
      // 관리자 화면 미리보기 전용: GitHub 원본 이미지를 그대로 참조 (실제 사이트는 Netlify 경로 사용)
      const cleanPath = item.image.replace(/^\//, '');
      img.src = repo ? 'https://raw.githubusercontent.com/' + repo + '/' + branch + '/' + cleanPath : '';
      img.alt = '';
      thumbTd.appendChild(img);

      const orderTd = document.createElement('td');
      orderTd.textContent = item.order;

      const pathTd = document.createElement('td');
      pathTd.textContent = item.image;
      pathTd.style.wordBreak = 'break-all';

      const exifTd = document.createElement('td');
      exifTd.textContent = item.exif;

      const visTd = document.createElement('td');
      visTd.innerHTML = item.visible === 'Y'
        ? '<span class="tag-y">공개</span>'
        : '<span class="tag-n">비공개</span>';

      tr.appendChild(thumbTd);
      tr.appendChild(orderTd);
      tr.appendChild(pathTd);
      tr.appendChild(exifTd);
      tr.appendChild(visTd);
      els.listBody.appendChild(tr);
    });
  }

  // ====== 등록 처리 ======
  function setStatus(message, type) {
    els.statusMsg.textContent = message;
    els.statusMsg.className = 'status-msg' + (type ? ' is-' + type : '');
  }

  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      const reader = new FileReader();
      reader.onload = function () { resolve(reader.result.split(',')[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function checkFileExists(repo, branch, path, token) {
    return fetch('https://api.github.com/repos/' + repo + '/contents/' + path + '?ref=' + branch, {
      headers: { Authorization: 'token ' + token, Accept: 'application/vnd.github+json' }
    }).then(function (res) { return res.status === 200; });
  }

  function uploadToGithub(repo, branch, path, token, base64Content) {
    return fetch('https://api.github.com/repos/' + repo + '/contents/' + path, {
      method: 'PUT',
      headers: {
        Authorization: 'token ' + token,
        Accept: 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: '포트폴리오 이미지 추가: ' + path,
        content: base64Content,
        branch: branch
      })
    }).then(function (res) {
      if (!res.ok) {
        return res.json().then(function (err) {
          throw new Error(err.message || 'GitHub 업로드 실패');
        });
      }
      return res.json();
    });
  }

  function addToSheet(appsScriptUrl, item) {
    return fetch(appsScriptUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(item)
    }).then(function (res) { return res.json(); });
  }

  els.submitBtn.addEventListener('click', function () {
    setStatus('', '');

    const token = els.ghToken.value.trim();
    const repo = els.ghRepo.value.trim();
    const branch = els.ghBranch.value.trim() || 'main';
    const appsScriptUrl = els.appsScriptUrl.value.trim();
    const fileName = els.fileName.value.trim();
    const order = els.orderInput.value.trim();
    const exif = els.exifInput.value.trim();
    const visible = els.visibleInput.checked ? 'Y' : 'N';

    if (!token || !repo || !appsScriptUrl) {
      setStatus('연결 설정(토큰/저장소/Apps Script URL)을 모두 입력해주세요.', 'error');
      return;
    }
    if (!selectedFile) {
      setStatus('사진 파일을 선택해주세요.', 'error');
      return;
    }
    if (!/^[a-zA-Z0-9._-]+$/.test(fileName)) {
      setStatus('파일명은 영문/숫자/하이픈/점만 사용해주세요. (한글, 공백 금지)', 'error');
      return;
    }
    if (!order) {
      setStatus('노출 순서를 입력해주세요.', 'error');
      return;
    }

    const path = 'images/portfolio/' + fileName;

    els.submitBtn.disabled = true;
    setStatus('업로드 중입니다...', '');

    checkFileExists(repo, branch, path, token)
      .then(function (exists) {
        if (exists) {
          throw new Error('이미 같은 파일명이 존재합니다. 다른 파일명을 사용해주세요.');
        }
        return fileToBase64(selectedFile);
      })
      .then(function (base64Content) {
        return uploadToGithub(repo, branch, path, token, base64Content);
      })
      .then(function () {
        return addToSheet(appsScriptUrl, {
          type: 'portfolio',
          order: order,
          image: '/' + path,
          exif: exif,
          visible: visible
        });
      })
      .then(function (sheetResult) {
        if (!sheetResult.success) {
          throw new Error('GitHub 업로드는 완료됐지만 시트 등록에 실패했습니다.');
        }
        setStatus('등록 완료. Netlify 재배포 후 사이트에 반영됩니다 (1~2분 소요).', 'success');

        // 입력값 초기화
        els.fileInput.value = '';
        els.fileName.value = '';
        els.orderInput.value = '';
        els.exifInput.value = '';
        els.previewThumb.style.display = 'none';
        els.fileDrop.classList.remove('has-file');
        els.fileDropLabel.textContent = '클릭해서 사진을 선택하세요';
        selectedFile = null;

        loadList();
      })
      .catch(function (err) {
        console.error('[포트폴리오 관리] 등록 실패:', err);
        setStatus(err.message || '등록 중 오류가 발생했습니다.', 'error');
      })
      .finally(function () {
        els.submitBtn.disabled = false;
      });
  });

  loadList();
})();
</script>

</body>
</html>
