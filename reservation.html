<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>예약하기</title><link rel="stylesheet" as="style" crossorigin  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" /><style>  * { box-sizing: border-box; }  body {    margin: 0;    background: #F5F6F3;  }  .booking-wrap {    --color-bg: #F5F6F3;    --color-surface: #FFFFFF;    --color-ink: #1B1F1B;    --color-ink-soft: #5B645B;    --color-accent: #2F6F4E;    --color-accent-soft: #E4EEE8;    --color-line: #DDE2DC;    --color-disabled: #C7CCC2;    --color-error: #B3493A;    --radius: 10px;    max-width: 480px;    margin: 0 auto;    padding: 32px 20px 48px;    background: var(--color-bg);    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;    color: var(--color-ink);  }  .booking-header {    margin-bottom: 28px;  }  .booking-eyebrow {    margin: 0 0 6px;    font-size: 12px;    font-weight: 600;    letter-spacing: 0.12em;    color: var(--color-accent);  }  .booking-title {    margin: 0 0 8px;    font-size: 26px;    font-weight: 700;    letter-spacing: -0.01em;  }  .booking-desc {    margin: 0;    font-size: 14px;    line-height: 1.55;    color: var(--color-ink-soft);  }  .booking-form {    display: flex;    flex-direction: column;    gap: 22px;  }  .booking-step {    background: var(--color-surface);    border: 1px solid var(--color-line);    border-radius: var(--radius);    padding: 18px 18px 20px;  }  .step-head {    display: flex;    align-items: center;    gap: 10px;    margin-bottom: 14px;  }  .step-num {    display: inline-flex;    align-items: center;    justify-content: center;    width: 26px;    height: 26px;    border-radius: 50%;    background: var(--color-accent);    color: #fff;    font-size: 12px;    font-weight: 700;    font-variant-numeric: tabular-nums;  }  .step-label {    font-size: 14px;    font-weight: 600;  }  .date-input,  .option-select,  .request-textarea,  .text-input {    width: 100%;    padding: 12px 14px;    font-size: 15px;    font-family: inherit;    color: var(--color-ink);    background: #fff;    border: 1px solid var(--color-line);    border-radius: 8px;    outline: none;    transition: border-color 0.15s ease;  }  .date-input:focus,  .option-select:focus,  .request-textarea:focus,  .text-input:focus {    border-color: var(--color-accent);    box-shadow: 0 0 0 3px var(--color-accent-soft);  }  .request-textarea {    resize: vertical;    line-height: 1.5;  }  .field-group {    display: flex;    flex-direction: column;    gap: 14px;  }  .field-label {    display: block;    margin: 0 0 6px;    font-size: 13px;    color: var(--color-ink-soft);  }  .time-slot-wrap {    display: grid;    grid-template-columns: repeat(3, 1fr);    gap: 8px;  }  .time-slot-placeholder {    grid-column: 1 / -1;    margin: 0;    padding: 10px 0;    font-size: 13px;    color: var(--color-ink-soft);    text-align: center;  }  .time-slot-btn {    padding: 10px 6px;    font-size: 14px;    font-family: inherit;    font-variant-numeric: tabular-nums;    background: #fff;    border: 1px solid var(--color-line);    border-radius: 8px;    color: var(--color-ink);    cursor: pointer;    transition: all 0.15s ease;  }  .time-slot-btn:hover:not(:disabled) {    border-color: var(--color-accent);  }  .time-slot-btn.is-selected {    background: var(--color-accent);    border-color: var(--color-accent);    color: #fff;  }  .time-slot-btn:disabled {    background: #F1F2EF;    border-color: var(--color-line);    color: var(--color-disabled);    text-decoration: line-through;    cursor: not-allowed;  }  .time-slot-btn:focus-visible,  .date-input:focus-visible,  .option-select:focus-visible,  .text-input:focus-visible,  .submit-btn:focus-visible {    outline: 2px solid var(--color-accent);    outline-offset: 2px;  }  .submit-btn {    padding: 15px;    font-size: 15px;    font-weight: 700;    font-family: inherit;    color: #fff;    background: var(--color-accent);    border: none;    border-radius: 8px;    cursor: pointer;    transition: opacity 0.15s ease;  }  .submit-btn:hover {    opacity: 0.9;  }  .submit-btn:disabled {    background: var(--color-disabled);    cursor: not-allowed;  }  .result-msg {    margin: 0;    min-height: 18px;    font-size: 13px;    text-align: center;  }  .result-msg.is-success {    color: var(--color-accent);  }  .result-msg.is-error {    color: var(--color-error);  }  @media (max-width: 360px) {    .time-slot-wrap {      grid-template-columns: repeat(2, 1fr);    }  }</style></head><body>  <div class="booking-wrap" id="bookingWrap">    <div class="booking-header">      <p class="booking-eyebrow">RESERVATION</p>      <h2 class="booking-title">예약하기</h2>      <p class="booking-desc">원하시는 날짜와 시간을 선택하고 예약을 완료해주세요.</p>    </div>    <form id="bookingForm" class="booking-form" novalidate>      <div class="booking-step">        <div class="step-head">          <span class="step-num">01</span>          <span class="step-label">날짜 선택</span>        </div>        <input type="date" id="dateInput" class="date-input" required>      </div>      <div class="booking-step">        <div class="step-head">          <span class="step-num">02</span>          <span class="step-label">시간 선택</span>        </div>        <div id="timeSlotWrap" class="time-slot-wrap">          <p class="time-slot-placeholder">날짜를 먼저 선택해주세요.</p>        </div>      </div>      <div class="booking-step">        <div class="step-head">          <span class="step-num">03</span>          <span class="step-label">예약 상품 선택</span>        </div>        <select id="optionSelect" class="option-select" required>          <option value="" disabled selected>옵션을 선택해주세요</option>        </select>      </div>      <div class="booking-step">        <div class="step-head">          <span class="step-num">04</span>          <span class="step-label">예약자 정보</span>        </div>        <div class="field-group">          <div>            <label class="field-label" for="nameInput">이름</label>            <input type="text" id="nameInput" class="text-input" placeholder="홍길동" required>          </div>          <div>            <label class="field-label" for="phoneInput">연락처</label>            <input type="tel" id="phoneInput" class="text-input" placeholder="010-1234-5678" required>          </div>          <div>            <label class="field-label" for="emailInput">이메일</label>            <input type="email" id="emailInput" class="text-input" placeholder="example@email.com" required>          </div>        </div>      </div>      <div class="booking-step">        <div class="step-head">          <span class="step-num">05</span>          <span class="step-label">요청사항 (선택)</span>        </div>        <textarea id="requestInput" class="request-textarea" rows="4" placeholder="전달하고 싶은 내용을 입력해주세요."></textarea>      </div>      <button type="submit" id="submitBtn" class="submit-btn">예약 확정하기</button>      <p id="resultMsg" class="result-msg" aria-live="polite"></p>    </form>  </div><script>(function () {  // ====== 설정값: 반드시 본인 환경에 맞게 수정하세요 ======  // 1) Apps Script 배포 후 발급받은 웹 앱 URL로 교체  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbytLnzQ4tbP7Ikf1xuMg9WtSWhUvUQDGo3XCdjCBCtLNH0Q3L2BqJ8nRsGADsn57T3a/exec';  // 2) 예약 가능한 시간대 (영업시간에 맞게 수정)  const TIME_SLOTS = ['10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00'];  // 3) 예약 상품 옵션 (실제 상품/서비스명으로 수정)  const PRODUCT_OPTIONS = [    { value: 'option-a', label: '상담 30분' },    { value: 'option-b', label: '상담 60분' },    { value: 'option-c', label: '방문 측정' }  ];  // ====== 이 아래부터는 로직 영역입니다 ======  const dateInput = document.getElementById('dateInput');  const timeSlotWrap = document.getElementById('timeSlotWrap');  const optionSelect = document.getElementById('optionSelect');  const nameInput = document.getElementById('nameInput');  const phoneInput = document.getElementById('phoneInput');  const emailInput = document.getElementById('emailInput');  const requestInput = document.getElementById('requestInput');  const bookingForm = document.getElementById('bookingForm');  const submitBtn = document.getElementById('submitBtn');  const resultMsg = document.getElementById('resultMsg');  let selectedTime = null;  const today = new Date();  dateInput.min = today.toISOString().split('T')[0];  PRODUCT_OPTIONS.forEach(function (opt) {    const el = document.createElement('option');    el.value = opt.value;    el.textContent = opt.label;    optionSelect.appendChild(el);  });  dateInput.addEventListener('change', function () {    selectedTime = null;    fetchBookedTimes(dateInput.value);  });  function fetchBookedTimes(date) {    timeSlotWrap.innerHTML = '<p class="time-slot-placeholder">시간 정보를 불러오는 중입니다...</p>';    fetch(APPS_SCRIPT_URL + '?date=' + encodeURIComponent(date))      .then(function (res) { return res.json(); })      .then(function (data) {        renderTimeSlots(data.bookedTimes || []);      })      .catch(function (err) {        console.error('[예약폼] 시간 조회 실패:', err);        timeSlotWrap.innerHTML = '<p class="time-slot-placeholder">시간 정보를 불러오지 못했습니다. 새로고침 후 다시 시도해주세요.</p>';      });  }  function renderTimeSlots(bookedTimes) {    timeSlotWrap.innerHTML = '';    TIME_SLOTS.forEach(function (time) {      const btn = document.createElement('button');      btn.type = 'button';      btn.className = 'time-slot-btn';      btn.textContent = time;      if (bookedTimes.indexOf(time) !== -1) {        btn.disabled = true;      } else {        btn.addEventListener('click', function () {          selectTime(time, btn);        });      }      timeSlotWrap.appendChild(btn);    });  }  function selectTime(time, btnEl) {    selectedTime = time;    document.querySelectorAll('.time-slot-btn').forEach(function (b) {      b.classList.remove('is-selected');    });    btnEl.classList.add('is-selected');  }  function isValidPhone(value) {    // 숫자와 하이픈만, 9~13자 (010-1234-5678 형태 기준, 필요시 정규식 조정)    return /^[0-9-]{9,13}$/.test(value);  }  function isValidEmail(value) {    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);  }  bookingForm.addEventListener('submit', function (e) {    e.preventDefault();    resultMsg.textContent = '';    resultMsg.className = 'result-msg';    if (!dateInput.value) { showResult('날짜를 선택해주세요.', 'error'); return; }    if (!selectedTime) { showResult('시간을 선택해주세요.', 'error'); return; }    if (!optionSelect.value) { showResult('예약 상품을 선택해주세요.', 'error'); return; }    if (nameInput.value.trim().length < 2) { showResult('이름을 정확히 입력해주세요.', 'error'); return; }    if (!isValidPhone(phoneInput.value.trim())) { showResult('연락처를 정확히 입력해주세요. (예: 010-1234-5678)', 'error'); return; }    if (!isValidEmail(emailInput.value.trim())) { showResult('이메일을 정확히 입력해주세요.', 'error'); return; }    const payload = {      date: dateInput.value,      time: selectedTime,      option: optionSelect.value,      name: nameInput.value.trim(),      phone: phoneInput.value.trim(),      email: emailInput.value.trim(),      request: requestInput.value    };    submitBtn.disabled = true;    submitBtn.textContent = '예약 처리 중...';    fetch(APPS_SCRIPT_URL, {      method: 'POST',      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // CORS 사전요청(preflight)을 피하기 위해 text/plain 사용      body: JSON.stringify(payload)    })      .then(function (res) { return res.json(); })      .then(function (data) {        if (data.success) {          showResult('예약이 완료되었습니다.', 'success');          bookingForm.reset();          selectedTime = null;          timeSlotWrap.innerHTML = '<p class="time-slot-placeholder">날짜를 먼저 선택해주세요.</p>';        } else {          showResult(data.message || '이미 예약된 시간입니다. 다른 시간을 선택해주세요.', 'error');          fetchBookedTimes(dateInput.value);        }      })      .catch(function (err) {        console.error('[예약폼] 예약 제출 실패:', err);        showResult('예약 처리 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.', 'error');      })      .finally(function () {        submitBtn.disabled = false;        submitBtn.textContent = '예약 확정하기';      });  });  function showResult(message, type) {    resultMsg.textContent = message;    resultMsg.className = 'result-msg is-' + type;  }})();</script></body></html>
